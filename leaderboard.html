  <style>
    .lb-wrap { max-width: 680px; margin: 0 auto; padding: 96px 20px 140px; }
    .lb-hero { text-align: center; margin-bottom: 34px; }
    .lb-hero h1 { font-family: var(--font-display); font-size: clamp(26px, 6vw, 36px); font-weight: 800; margin-bottom: 8px; }
    .lb-hero p { color: var(--text-dim); font-size: 14.5px; }
    .lb-period { display: inline-flex; align-items: center; gap: 7px; background: var(--surface-2); border: 1px solid var(--border-soft); padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--text-dim); margin-top: 12px; }
    .lb-period .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; animation: pulse-dot 2s infinite; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }

    .lb-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 26px; flex-wrap: wrap; }
    .lb-tab {
      padding: 10px 22px; border-radius: 999px; border: 1.5px solid var(--border-soft);
      background: var(--surface); color: var(--text-dim); font-size: 14px; font-weight: 700;
      cursor: pointer; transition: all 0.22s; min-height: 44px;
      font-family: inherit;
    }
    .lb-tab:hover { border-color: var(--primary); color: var(--text); }
    .lb-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 6px 18px rgba(79,140,255,0.35); }

    .podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 10px; align-items: end; margin-bottom: 28px; }
    .pod { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 18px; padding: 18px 10px 14px; text-align: center; position: relative; }
    .pod.first { padding: 26px 10px 18px; border-color: var(--accent); box-shadow: 0 0 30px rgba(246,185,59,0.12); }
    .pod .medal { width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;font-weight:800;font-family:var(--font-display);font-size:15px;background:var(--surface-3);border:1px solid var(--border);color:var(--text-dim); }
    .pod.first .medal { background:linear-gradient(135deg,var(--accent),#ff8a3d);color:var(--accent-ink);border-color:transparent; }
    .pod .ava, .pod .ava-i { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px; display: block; }
    .pod .ava-i { background: linear-gradient(135deg, var(--accent), #ff8a3d); color: var(--accent-ink); font-weight: 800; font-size: 21px; display: grid; place-items: center; }
    .pod .nm { font-weight: 700; font-size: 13.5px; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pod .sc { font-size: 21px; font-weight: 800; font-family: var(--font-display); color: var(--accent); }
    .pod .att { font-size: 11px; color: var(--text-faint); margin-top: 3px; }

    .lb-list { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 18px; overflow: hidden; }
    .lb-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--border-soft); }
    .lb-row:last-child { border-bottom: none; }
    .lb-row.me { background: rgba(79,140,255,0.08); border-left: 3px solid var(--primary); }
    .lb-rank { width: 34px; text-align: center; font-weight: 800; font-family: var(--font-display); color: var(--text-dim); font-size: 15px; flex-shrink: 0; }
    .lb-ava, .lb-ava-i { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .lb-ava-i { background: var(--surface-3); border: 1px solid var(--border); font-weight: 800; font-size: 15px; display: grid; place-items: center; }
    .lb-name { flex: 1; min-width: 0; font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-name .you { font-size: 11px; background: var(--primary); color: #fff; padding: 2px 8px; border-radius: 999px; margin-left: 8px; font-weight: 700; }
    .lb-score { font-weight: 800; font-family: var(--font-display); font-size: 17px; color: var(--accent); }
    .lb-att { font-size: 11.5px; color: var(--text-faint); text-align: right; }

    .lb-empty { text-align: center; padding: 70px 20px; color: var(--text-dim); }
    .lb-cta { text-align: center; margin-top: 26px; }
    @media (max-width: 480px) {
      .lb-wrap { padding: 80px 14px 120px; }
      .lb-row { padding: 12px 14px; gap: 10px; }
      .lb-rank { width: 26px; }

<body>

  <div class="bg-fx"></div>
  <div id="topbar-mount"></div>
  <main class="lb-wrap">
    <div class="lb-hero">
      <h1>Peringkat Tes TOEFL Gratis</h1>
      <p>Skor Full Test ITP gratis terbaik dari komunitas TOEFL Yuk</p>
      <div class="lb-period"><span class="dot"></span>Semua skor Full Test ITP · diperbarui real-time</div>
    </div>
    <div class="lb-tabs" role="tablist">
      <button class="lb-tab" data-period="daily" role="tab">Hari ini</button>
      <button class="lb-tab" data-period="weekly" role="tab">Minggu ini</button>
      <button class="lb-tab active" data-period="monthly" role="tab" aria-selected="true">30 hari</button>
    </div>
    <div id="lb-content">
      <div class="lb-empty"><p>Memuat peringkat…</p></div>
    </div>
    <div class="lb-cta">
      <a href="./" class="btn btn-primary">Ikut test, masuk papan skor →</a>
    </div>
  </main>
  <div id="bottomnav-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="js/supabase-config.js?v=25"></script>
  <script src="js/timer.js?v=25"></script>
  <script src="js/auth.js?v=25"></script>
  <script src="js/bottomnav.js?v=25"></script>
  <script>
    (function () {
      var content = document.getElementById("lb-content");
      function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
      // Anonimkan: "Budi Santoso" → "Budi S."
      function shortName(n) {
        n = (n || "Peserta").trim();
        var parts = n.split(/\s+/);
        if (parts.length === 1) return parts[0];
        return parts[0] + " " + parts[1].charAt(0).toUpperCase() + ".";
      }
      function cefrOf(score) {
        if (score >= 627) return "C1";
        if (score >= 543) return "B2";
        if (score >= 460) return "B1";
        if (score >= 337) return "A2";
        return "A1";
      }

      function render(rows, myId) {
        if (!rows.length) {
          content.innerHTML =
            '<div class="lb-empty">' +
              '<div style="font-size:44px;margin-bottom:14px" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#f6b93b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div>' +
              '<h3 style="margin-bottom:8px">Belum ada yang masuk papan</h3>' +
              '<p>Jadilah yang pertama — selesaikan satu Full Test!</p>' +
            '</div>';
          return;
        }
        var top3 = rows.slice(0, 3), rest = rows.slice(3);
        var medals = ["1","2","3"];
        var order = [1, 0, 2]; // 2nd, 1st, 3rd visual order

        var podiumHtml = '<div class="podium">' + order.map(function (i) {
          var r = top3[i];
          if (!r) return "<div></div>";
          var nm = shortName(r.player_name || r.full_name);
          var ava = r.avatar_url
            ? '<img class="ava" src="' + esc(r.avatar_url) + '" alt="" referrerpolicy="no-referrer">'
            : '<span class="ava-i">' + esc(nm.charAt(0).toUpperCase()) + "</span>";
          return '<div class="pod' + (i === 0 ? " first" : "") + '">' +
            '<span class="medal">' + medals[i] + "</span>" + ava +
            '<div class="nm">' + esc(nm) + "</div>" +
            '<div class="sc">' + r.best_score + "</div>" +
            '<div class="att">' + cefrOf(r.best_score) + " · " + r.attempts + " test</div>" +
          "</div>";
        }).join("") + "</div>";

        var listHtml = '<div class="lb-list">' + rest.map(function (r, i) {
          var nm = shortName(r.player_name || r.full_name);
          var ava = r.avatar_url
            ? '<img class="lb-ava" src="' + esc(r.avatar_url) + '" alt="" referrerpolicy="no-referrer">'
            : '<span class="lb-ava-i">' + esc(nm.charAt(0).toUpperCase()) + "</span>";
          return '<div class="lb-row">' +
            '<span class="lb-rank">' + (i + 4) + "</span>" + ava +
            '<span class="lb-name">' + esc(nm) + "</span>" +
            '<span class="lb-att">' + cefrOf(r.best_score) + "</span>" +
            '<span class="lb-score">' + r.best_score + "</span>" +
          "</div>";
        }).join("") + "</div>";

        content.innerHTML = podiumHtml + listHtml;
      }

      var currentPeriod = "monthly";

      function load(period) {
        currentPeriod = period;
        content.innerHTML = '<div class="lb-empty"><p>Memuat peringkat…</p></div>';
        if (!window.ToeflAuth) { render([], null); return; }
        ToeflAuth.init().then(function () {
          Promise.all([ToeflAuth.fetchLeaderboard(30, period), ToeflAuth.getUser()]).then(function (rs) {
            render(rs[0], rs[1] ? rs[1].id : null);
          });
        });
      }

      function init() {
        document.querySelectorAll(".lb-tab").forEach(function (tab) {
          tab.addEventListener("click", function () {
            document.querySelectorAll(".lb-tab").forEach(function (t) {
              t.classList.remove("active");
              t.removeAttribute("aria-selected");
            });
            tab.classList.add("active");
            tab.setAttribute("aria-selected", "true");
            load(tab.getAttribute("data-period"));
          });
        });
        load(currentPeriod);
      }
      document.addEventListener("DOMContentLoaded", init);
      if (document.readyState !== "loading") init();
    })();
  </script>
